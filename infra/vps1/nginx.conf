# ------------------------------------------------------------------
# VPS 1 — Nginx reverse proxy for Keycloak (auth.newshare.example)
# ------------------------------------------------------------------

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name auth.newshare.example;

    # ACME challenge support for Let's Encrypt renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Keycloak TLS termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.newshare.example;

    # ----- TLS -----
    ssl_certificate     /etc/letsencrypt/live/auth.newshare.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.newshare.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- Security headers -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ----- WebFinger (RFC 7033) -----
    # Allows federated discovery of the Newshare OIDC issuer.
    location /.well-known/webfinger {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
    }

    # ----- Keycloak reverse proxy -----
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # WebSocket support (Keycloak admin console)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # ----- Keycloak health endpoint (restrict to localhost) -----
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
}
