# VPS 1 — Home Base (the ASP side)
#
# Apache terminates TLS and reverse-proxies to containers bound on 127.0.0.1.
# No service port is reachable from the internet; CSF allows only 22, 80 and
# 443, and every container publishes to loopback only.
#
# certbot --apache adds the matching :443 vhosts and the HTTP redirect, so this
# file stays as the plain-HTTP definition it needs to find first.
#
# Note ProxyPreserveHost: Keycloak builds issuer URLs and redirect targets from
# the Host header. Without it every token would be issued for "localhost" and
# the whole OIDC flow would fail in ways that look like a client
# misconfiguration rather than a proxy one.

# ── auth.itega.org — Keycloak, both home-base realms ────────────────
<VirtualHost *:80>
    ServerName auth.itega.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Keycloak's admin console and account pages are chatty; a short timeout
    # here surfaces as a broken login rather than a slow one.
    ProxyTimeout 120

    ErrorLog  /var/log/httpd/auth-error.log
    CustomLog /var/log/httpd/auth-access.log combined
</VirtualHost>

# ── agent-c.itega.org — Publisher C's Retail Agent ──────────────────
# This is the service that holds the markup and decides whether to authorise a
# purchase. It runs on the home base's host, never ITEGA's.
<VirtualHost *:80>
    ServerName agent-c.itega.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8003/
    ProxyPassReverse / http://127.0.0.1:8003/

    ErrorLog  /var/log/httpd/agent-c-error.log
    CustomLog /var/log/httpd/agent-c-access.log combined
</VirtualHost>

# ── agent-demo.itega.org — the second home base's Retail Agent ──────
<VirtualHost *:80>
    ServerName agent-demo.itega.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8004/
    ProxyPassReverse / http://127.0.0.1:8004/

    ErrorLog  /var/log/httpd/agent-demo-error.log
    CustomLog /var/log/httpd/agent-demo-access.log combined
</VirtualHost>
