# VPS 2 — ALS (the ITEGA side)
#
# Apache terminates TLS and reverse-proxies to containers bound on 127.0.0.1.
# certbot --apache adds the matching :443 vhosts and the HTTP redirect.

# ── als.itega.org — Authenticator and Logger ────────────────────────
#
# Two services behind one name, split by path. The Authenticator owns the
# reader-facing and machine-facing auth paths; the Logger owns event ingestion
# and reporting.
<VirtualHost *:80>
    ServerName als.itega.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Authenticator: OIDC flow, token validation, home-base chooser
    ProxyPass        /auth/      http://127.0.0.1:8000/auth/
    ProxyPassReverse /auth/      http://127.0.0.1:8000/auth/

    # Authenticator: the machine-to-machine path for AI answer engines
    ProxyPass        /ai-agent/  http://127.0.0.1:8000/ai-agent/
    ProxyPassReverse /ai-agent/  http://127.0.0.1:8000/ai-agent/

    # Published so publishers can verify session tokens offline rather than
    # calling /auth/validate on every page view.
    ProxyPass        /.well-known/  http://127.0.0.1:8000/.well-known/
    ProxyPassReverse /.well-known/  http://127.0.0.1:8000/.well-known/

    # Logger: event ingestion and the two report endpoints
    ProxyPass        /log/       http://127.0.0.1:8001/log/
    ProxyPassReverse /log/       http://127.0.0.1:8001/log/

    ErrorLog  /var/log/httpd/als-error.log
    CustomLog /var/log/httpd/als-access.log combined
</VirtualHost>

# ── network.itega.org — the ITEGA directory ─────────────────────────
#
# The trust anchor: which home bases and publishers ITEGA certifies, and where
# each home base's endpoints and Retail Agent can be found.
<VirtualHost *:80>
    ServerName network.itega.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8002/
    ProxyPassReverse / http://127.0.0.1:8002/

    ErrorLog  /var/log/httpd/network-error.log
    CustomLog /var/log/httpd/network-access.log combined
</VirtualHost>

# ── dashboard.itega.org — reader dashboard and the /demo walkthrough ─
#
# Static build, served directly rather than proxied. The React app owns its own
# routing, so anything that is not a real file falls through to index.html --
# without that, a reload on /demo returns 404 mid-presentation.
<VirtualHost *:80>
    ServerName dashboard.itega.org
    DocumentRoot /var/www/dashboard

    <Directory /var/www/dashboard>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ index.html [L]
    </Directory>

    # Hashed asset filenames change on every build, so they are safe to cache
    # hard. index.html must not be, or a redeploy leaves viewers on the old app.
    <FilesMatch "\.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    ErrorLog  /var/log/httpd/dashboard-error.log
    CustomLog /var/log/httpd/dashboard-access.log combined
</VirtualHost>
