# ------------------------------------------------------------------
# VPS 2 — Nginx reverse proxy for ALS services, network discovery,
#          and the operator dashboard.
#
# Nginx runs directly on the host (not in Docker). It terminates
# TLS and reverse-proxies to Docker containers bound to 127.0.0.1.
# Docker services are NOT exposed to the public network.
# ------------------------------------------------------------------

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name als.newshare.example network.newshare.example dashboard.newshare.example;

    # ACME challenge support for Let's Encrypt renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# ALS API — als.newshare.example
# ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name als.newshare.example;

    # ----- TLS -----
    ssl_certificate     /etc/letsencrypt/live/als.newshare.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/als.newshare.example/privkey.pem;
    # TLS 1.3 ONLY — per Newshare Network spec requirement.
    # TLS 1.2 is explicitly excluded for all network connections.
    ssl_protocols       TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- Security headers -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ----- ALS Auth Service -----
    location /auth/ {
        proxy_pass http://127.0.0.1:8000/auth/;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # ----- ALS Logging Service -----
    location /log/ {
        proxy_pass http://127.0.0.1:8001/log/;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Deny everything else
    location / {
        return 404;
    }
}

# ------------------------------------------------------------------
# Network Discovery — network.newshare.example
# ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name network.newshare.example;

    # ----- TLS -----
    ssl_certificate     /etc/letsencrypt/live/network.newshare.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/network.newshare.example/privkey.pem;
    # TLS 1.3 ONLY — per Newshare Network spec requirement.
    ssl_protocols       TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- Security headers -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    root /var/www/network-discovery;
    index newshare-network.json;

    # Serve .well-known discovery documents
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    # Serve the network manifest at the root
    location / {
        default_type application/json;
        try_files $uri =404;
    }
}

# ------------------------------------------------------------------
# Dashboard — dashboard.newshare.example
# ------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.newshare.example;

    # ----- TLS -----
    ssl_certificate     /etc/letsencrypt/live/dashboard.newshare.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.newshare.example/privkey.pem;
    # TLS 1.3 ONLY — per Newshare Network spec requirement.
    ssl_protocols       TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- Security headers -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://als.newshare.example https://auth.newshare.example;" always;

    root /var/www/dashboard/dist;
    index index.html;

    # SPA fallback — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    # NOTE: Nginx's add_header in a location block replaces (not appends to)
    # headers from the parent server block, so security headers must be repeated.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }
}
