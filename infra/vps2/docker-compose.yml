# ============================================================
# VPS 2 — ALS Services (Auth, Logging, Settlement)
# Target: DigitalOcean 4 GB Droplet
#
# NOTE: "version" key is omitted — it is deprecated in Docker
# Compose V2 and ignored by modern docker compose.
#
# Docker networking: All services are on the "als" bridge
# network and can reach each other by container name (e.g.,
# als-auth can connect to "postgres:5432" or "als-logging:8001").
# Host-side ports are bound to 127.0.0.1 only — Nginx on the
# host terminates TLS and reverse-proxies into these ports.
# ============================================================

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: als-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: als
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: als_logs
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U als"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - als

  als-auth:
    build:
      context: ../../src/als-auth/
      dockerfile: Dockerfile
    container_name: als-auth
    restart: unless-stopped
    environment:
      # asyncpg uses plain postgresql:// DSNs, NOT SQLAlchemy-style postgresql+asyncpg://
      DATABASE_URL: postgresql://als:${POSTGRES_PASSWORD}@postgres:5432/als_logs
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-newshare}
      ALS_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      ALS_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      SESSION_SECRET: ${SESSION_SECRET}
      LOGGING_SERVICE_URL: http://als-logging:8001
      # Where the certified-home-base registry lives. Without this the
      # Authenticator cannot resolve a reader to a home base and every
      # authorize request fails, so it is not optional.
      DISCOVERY_SERVICE_URL: http://network-discovery:8002
      PUBLISHERS_CONFIG: ${PUBLISHERS_CONFIG:-[]}
      # Certified AI agents and the terms each agreed to. Mounted read-only
      # from the repo so ITEGA's membership decisions stay in version control.
      AI_AGENTS_REGISTRY_PATH: /app/data/ai-agents.json
      AI_GRANT_TTL: ${AI_GRANT_TTL:-3600}
      AI_AGENT_SIGNUP_URL: ${AI_AGENT_SIGNUP_URL:-https://itega.org/join}
      ALS_BASE_URL: ${ALS_BASE_URL:-https://als.newshare.example}
      LOGGING_API_KEY: ${LOGGING_API_KEY}
    volumes:
      - ../../src/als-auth/data/ai-agents.json:/app/data/ai-agents.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
      network-discovery:
        condition: service_started
    networks:
      - als

  als-logging:
    build:
      context: ../../src/als-logging/
      dockerfile: Dockerfile
    container_name: als-logging
    restart: unless-stopped
    environment:
      # asyncpg uses plain postgresql:// DSNs, NOT SQLAlchemy-style postgresql+asyncpg://
      DATABASE_URL: postgresql://als:${POSTGRES_PASSWORD}@postgres:5432/als_logs
      # The internal key: the Auth Service and the settlement scripts, which
      # legitimately file events for every publisher.
      API_KEY: ${ALS_API_KEY}
      # Per-publisher keys, written by the discovery service when a
      # publisher's plugin provisions itself. Read-only here: this service
      # verifies keys, it never issues them.
      PUBLISHER_KEYS_PATH: /app/data/provisioning.json
    volumes:
      - ./data/provisioning.json:/app/data/provisioning.json:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - als

  # ----------------------------------------------------------------
  # Network Discovery — the ITEGA directory of certified members.
  #
  # The trust anchor for the network: which home bases and publishers
  # ITEGA currently certifies, and where each home base's OIDC
  # endpoints and Retail Agent can be found. The Authenticator reads
  # it to resolve a visiting reader to their home base, so a suspended
  # member disappears from the network without redeploying anything.
  #
  # The registry file is mounted read-only from the repo, keeping
  # ITEGA's certification decisions reviewable in version control.
  # ----------------------------------------------------------------

  network-discovery:
    build:
      context: ../../src/network-discovery/
      dockerfile: Dockerfile
    container_name: network-discovery
    restart: unless-stopped
    environment:
      DISCOVERY_BASE_URL: ${DISCOVERY_BASE_URL:-https://network.newshare.example}
      REGISTRY_PATH: /app/data/registry.json
      # Registered publisher domains and their credentials. Mounted writable
      # because provisioning records each issuance; kept out of the repo and
      # out of the public registry, because it holds keys.
      PROVISIONING_PATH: /app/data/provisioning.json
      NETWORK_NAME: ${NETWORK_NAME:-Newshare Network}
    volumes:
      - ../../src/network-discovery/data/registry.json:/app/data/registry.json:ro
      - ./data/provisioning.json:/app/data/provisioning.json:rw
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - als
    mem_limit: 128m

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_PATH:-./secrets/jwt_private.pem}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_PATH:-./secrets/jwt_public.pem}

volumes:
  pgdata:
    driver: local

networks:
  als:
    driver: bridge
