<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 210"
     width="980" height="210" role="img" aria-label="West End Sentinel, Boston">
  <title>West End Sentinel</title>
  <!--
    Lighthouse from Tabler Icons (MIT). A lighthouse rather than a lantern
    because a sentinel keeps watch for other people's benefit, which is what a
    home base does for a reader at a paper it has never met.
  -->
  <g transform="translate(28 34) scale(5.6)" fill="none" stroke="#16263a"
     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l2 3l2 15h-8l2 -15l2 -3"/>
      <path d="M8 9l8 0"/>
      <path d="M3 11l2 -2l-2 -2"/>
      <path d="M21 11l-2 -2l2 -2"/>
  </g>
  <!-- the light itself, the one warm mark -->
  <circle cx="96" cy="66" r="7" fill="#c8862a"/>

  <text x="196" y="112" font-family="Iowan Old Style, Palatino, Georgia, serif"
        font-weight="600" font-size="64" letter-spacing="1" fill="#16263a">WEST END SENTINEL</text>
  <path d="M198 138 H 890" stroke="#16263a" stroke-width="2"/>
  <text x="200" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="500" font-size="19" letter-spacing="6" fill="#4a5c66">BOSTON, MASSACHUSETTS</text>
</svg>
